<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="ht.js"></script>
<style>body{width:800px;height:800px;overflow:hidden;position:relative;background:#F3F3F6}
img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:800px;filter:saturate(1.05) contrast(1.04)}
.fade{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(243,243,246,.0) 0,rgba(243,243,246,.55) 70%)}</style></head><body>
<canvas class="ht" id="c" style="opacity:.5"></canvas><div class="fade"></div><img src="../assets/foto-recorte.png">
<script>halftone(document.getElementById('c'),(x,y,ph)=>{return Math.min(.7,.85-Math.hypot(x-.5,y-.35)*1.2+Math.sin(x*7+ph*5)*.06)},16);</script>
</body></html>
