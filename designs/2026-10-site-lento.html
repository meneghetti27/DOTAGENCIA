<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,500&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;overflow:hidden;background:#05060A;font-family:Inter,sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(60% 38% at 50% 58%,rgba(18,39,94,.85) 0%,rgba(11,26,74,.45) 45%,rgba(5,6,10,0) 75%),
 radial-gradient(50% 30% at 50% 100%,rgba(20,40,110,.35),rgba(5,6,10,0) 70%)}
.head{position:absolute;top:62px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:18px}
.logo{font-family:Inter;font-weight:800;font-size:36px;letter-spacing:-.05em}
.logo i{font-style:normal;color:#3D6EF5}
.bar{width:2px;height:30px;background:#5a6070}
.handle{font-weight:500;font-size:19px;letter-spacing:.32em;color:#C9CEDA}
.serif{position:absolute;top:128px;left:0;right:0;text-align:center;font-family:"Playfair Display";font-style:italic;font-size:68px;color:#9DB5FF}
.hero{position:absolute;top:222px;left:0;right:0;text-align:center;font-family:Anton;font-size:184px;line-height:1;white-space:nowrap;
 background:linear-gradient(180deg,#E4ECFF 15%,#B6CBFF 50%,#5F8FFE 92%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 40px rgba(61,110,245,.25))}
.card{position:absolute;border-radius:28px;display:flex;align-items:center;justify-content:space-between;padding:0 36px}
.a{top:560px;left:150px;right:150px;height:170px;background:linear-gradient(180deg,#0E142A,#0B1023);border:1.5px solid rgba(120,135,170,.14);opacity:.85}
.b{top:770px;left:130px;right:130px;height:200px;background:linear-gradient(180deg,#121a3a,#0B1023);border:2px solid #3D6EF5;
 box-shadow:0 0 50px rgba(61,110,245,.45),inset 0 0 30px rgba(61,110,245,.12)}
.info{flex:1;padding-right:40px}
.name{font-family:"Plus Jakarta Sans";font-weight:800;font-size:34px}
.a .name{color:#8C93A6}
.url{font-size:22px;margin-top:6px;color:#6E768A}
.b .url{color:#B8BFCC}
.track{margin-top:20px;height:12px;border-radius:99px;background:#1A2140;overflow:hidden;position:relative}
.a .track i{position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:99px;background:#3a4258}
.b .track i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:99px;background:linear-gradient(90deg,#3D6EF5,#87A9FF);box-shadow:0 0 18px rgba(135,169,255,.8)}
.time{text-align:right}
.time b{font-family:Anton;font-weight:400;display:block;line-height:1}
.a .time b{font-size:78px;color:#5F667A}
.b .time b{font-size:96px;background:linear-gradient(180deg,#E4ECFF,#87A9FF 55%,#5F8FFE);-webkit-background-clip:text;background-clip:text;color:transparent}
.time small{font-size:19px;font-weight:600;letter-spacing:.2em}
.a .time small{color:#FF8D96}
.b .time small{color:#9DB5FF}
.lead{position:absolute;top:1018px;left:0;right:0;text-align:center;font-size:32px;color:#E6E9F0}
.close{position:absolute;top:1062px;left:0;right:0;text-align:center;font-family:Anton;font-size:90px;line-height:.98}
.close .w{color:#fff}
.close .bl{background:linear-gradient(180deg,#87A9FF 0%,#3D6EF5 60%,#2F5BEA 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(61,110,245,.55))}
.foot{position:absolute;top:1278px;left:0;right:0;text-align:center;font-size:18px;color:#7A8194}
</style></head><body>
<div class="bg"></div>
<div class="head"><span class="logo">dot<i>.</i></span><span class="bar"></span><span class="handle">@MARKETINGDOTAGENCY</span></div>
<div class="serif">seu cliente espera só</div>
<div class="hero">3 SEGUNDOS.</div>

<div class="card a">
  <div class="info"><div class="name">Site lento</div><div class="url">carregando…</div><div class="track"><i></i></div></div>
  <div class="time"><b>6,2s</b><small>JÁ FOI EMBORA</small></div>
</div>
<div class="card b">
  <div class="info"><div class="name">Site feito pela dot.</div><div class="url">abre na hora, no celular.</div><div class="track"><i></i></div></div>
  <div class="time"><b>1,4s</b><small>VIROU CONTATO</small></div>
</div>

<div class="lead">No celular, a paciência é curta.</div>
<div class="close"><span class="w">53% DESISTEM</span><br><span class="bl">ANTES DE TE CONHECER.</span></div>
<div class="foot">Fonte: Google (sites no celular acima de 3 s). Tempos ilustrativos.</div>
</body></html>
