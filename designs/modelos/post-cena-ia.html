<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;overflow:hidden;background:#04050A;font-family:Inter,sans-serif;color:#fff;position:relative}
.layer{position:absolute;inset:0}
.scene{background:url(../assets/esqueleto-cena.png) center/cover;filter:saturate(1.15) contrast(1.05)}
.cut{background:url(../assets/esqueleto-recorte.png) center/cover;z-index:3;filter:saturate(1.15) contrast(1.05)}
/* cabeçalho estilo perfil */
.head{position:absolute;top:86px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;z-index:6}
.ico{width:44px;height:44px;border-radius:50%;background:#0B1230;border:1.5px solid rgba(120,160,255,.5);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;letter-spacing:-.05em;box-shadow:0 0 18px rgba(61,110,245,.5)}
.ico i{font-style:normal;color:#3D6EF5}
.who{line-height:1.15}
.who b{font-weight:700;font-size:21px;display:flex;align-items:center;gap:7px}
.who b svg{width:18px;height:18px}
.who span{font-size:16px;color:#B9C1D6}
/* título */
.title{position:absolute;top:196px;left:0;right:0;text-align:center;font-family:"League Gothic";text-transform:uppercase;z-index:2;line-height:.86}
.l1,.l2{display:block;white-space:nowrap}
.l1{font-size:178px;color:#fff;letter-spacing:.01em;text-shadow:0 0 30px rgba(120,160,255,.35)}
.l2{font-size:206px;letter-spacing:.005em;-webkit-text-stroke:2px transparent}
.l2 span{background:linear-gradient(90deg,#DCE6FF 12%,#8FB0FF 38%,#4F80FF 66%,#3D6EF5 90%);background-size:1080px 100%;background-attachment:fixed;-webkit-background-clip:text;background-clip:text;color:transparent}
.b1{filter:blur(2.5px)}
.b2{filter:blur(4px)}
.glow2{position:absolute;top:338px;left:0;right:0;text-align:center;font-family:"League Gothic";font-size:206px;line-height:.86;color:#3D6EF5;opacity:.6;filter:blur(30px);z-index:1}
/* toolbar de designer */
.tools{position:absolute;left:96px;top:236px;display:flex;flex-direction:column;gap:16px;z-index:6;opacity:.7}
.tools svg{width:18px;height:18px;stroke:#E2E8FF;fill:none;stroke-width:1.6}
/* faíscas na frente */
.sparks{z-index:5}
.sparks i{position:absolute;border-radius:50%;background:#DDE6FF;box-shadow:0 0 8px 2px rgba(110,155,255,.95)}
.sparks i.s{width:3px;height:3px}
.sparks i.m{width:5px;height:5px}
.sparks i.l{width:9px;height:9px;filter:blur(2.5px);opacity:.7}
.sparks i.t{width:16px;height:3px;border-radius:3px;transform:rotate(-35deg)}
.fade{z-index:4;background:linear-gradient(180deg,transparent 76%,rgba(4,5,10,.72) 88%,rgba(4,5,10,.92) 100%)}
.stat{position:absolute;left:0;right:0;bottom:58px;text-align:center;z-index:6;font-size:30px;color:#D9DEEA;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.stat b{font-weight:800;color:#fff}
.stat b.bl{color:#8FB0FF}
.foot{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:14px;letter-spacing:.14em;color:#7A8194;z-index:6}
.vig{z-index:5;background:radial-gradient(120% 90% at 50% 45%,transparent 60%,rgba(0,0,0,.45) 100%)}
</style></head><body>
<div class="layer scene"></div>
<div class="glow2">VER SEU SITE.</div>
<div class="title">
 <span class="l1"><span class="b2">E</span><span class="b1">L</span>E SÓ QUERI<span class="b1">A</span></span>
 <span class="l2"><span class="b1">V</span><span>ER SEU SIT</span><span class="b1">E.</span></span>
</div>
<div class="layer cut"></div>
<div class="layer fade"></div>
<div class="layer vig"></div>
<div class="stat"><b>53%</b> desistem se o site demora <b class="bl">mais de 3 segundos.</b></div>
<div class="foot">FONTE: GOOGLE</div>
<div class="head">
 <div class="ico">dot<i>.</i></div>
 <div class="who"><b>Agência dot.
  <svg viewBox="0 0 24 24"><path fill="#3D8BFF" d="M12 1l2.6 2.2 3.4-.4.9 3.3 3 1.7-1.2 3.2 1.2 3.2-3 1.7-.9 3.3-3.4-.4L12 23l-2.6-2.2-3.4.4-.9-3.3-3-1.7 1.2-3.2L2.1 9.8l3-1.7.9-3.3 3.4.4z"/><path d="M7.5 12.2l3 3 6-6.2" stroke="#fff" stroke-width="2.2" fill="none"/></svg></b>
  <span>@marketingdotagency</span></div>
</div>
<div class="tools">
 <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg>
 <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="3 2"/></svg>
 <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></svg>
 <svg viewBox="0 0 24 24"><path d="M5 3l12 9-6 1-3 6z"/></svg>
 <svg viewBox="0 0 24 24"><path d="M6 4h12M12 4v16"/></svg>
 <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>
</div>
<div class="layer sparks">
 <i class="s" style="left:212px;top:300px"></i><i class="m" style="left:318px;top:452px"></i>
 <i class="t" style="left:640px;top:330px"></i><i class="s" style="left:705px;top:478px"></i>
 <i class="l" style="left:860px;top:280px"></i><i class="s" style="left:905px;top:402px"></i>
 <i class="m" style="left:170px;top:520px"></i><i class="t" style="left:470px;top:250px;transform:rotate(-20deg)"></i>
 <i class="l" style="left:140px;top:380px"></i><i class="s" style="left:560px;top:540px"></i>
 <i class="s" style="left:960px;top:600px"></i><i class="m" style="left:96px;top:640px"></i>
 <i class="t" style="left:930px;top:520px;transform:rotate(-50deg)"></i><i class="l" style="left:620px;top:600px"></i>
 <i class="s" style="left:780px;top:250px"></i><i class="s" style="left:400px;top:600px"></i>
</div>
</body></html>
