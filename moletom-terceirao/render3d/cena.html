<!doctype html><html><head><meta charset=utf-8>
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Estúdio 3D do Terceirão: ?modo=slab|caneca|garrafa|botton|adesivos &img=... &az=..&el=..&zoom=..
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search), W = +q.get('w') || 1600, H = +q.get('h') || 1600;
const modo = q.get('modo') || 'slab', az = +(q.get('az') || 0), el = +(q.get('el') || 8), zoom = +(q.get('zoom') || 1);
const r = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
r.setSize(W, H); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = +(q.get('exp') || 1.05);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const cena = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); cena.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
cena.environmentIntensity = +(q.get('env') || 0.35);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
const d = 9 / zoom, a = az * Math.PI / 180, e = el * Math.PI / 180;
cam.position.set(Math.sin(a) * Math.cos(e) * d, Math.sin(e) * d, Math.cos(a) * Math.cos(e) * d); cam.lookAt(0, 0, 0);
// luzes: chave branca suave em cima, recortes roxos dos lados, contra-luz lilás
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-2, 6, 5); key.castShadow = true; cena.add(key);
key.shadow.mapSize.set(2048, 2048);
for (const [x, c, i] of [[-6, 0x9b5cff, 60], [6, 0xb47dff, 70]]) { const l = new THREE.PointLight(c, i, 30, 1.6); l.position.set(x, 1.5, -2.5); cena.add(l); }
const back = new THREE.PointLight(0xe4cff7, 25, 30, 1.8); back.position.set(0, 3, -5); cena.add(back);
const fill = new THREE.PointLight(0x7a4c99, 12, 20, 2); fill.position.set(0, -2, 5); cena.add(fill);
const tl = new THREE.TextureLoader();
const load = src => new Promise(res => tl.load(src, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; res(t); }));

async function slab(src, alt = 4.2, esp = 0.32, camadas = 46) {
  // adesivo grosso 2.5D: pilha de planos com o recorte da arte; topo com a arte, laterais na cor uva
  const t = await load(src); const asp = t.image.width / t.image.height; const g = new THREE.Group();
  const geo = new THREE.PlaneGeometry(alt * asp, alt);
  const lado = new THREE.MeshStandardMaterial({color: 0x2a1838, roughness: .55, metalness: .1, alphaMap: t, alphaTest: .5, map: null});
  // alphaMap usa o canal G; montamos uma máscara a partir do alpha da imagem
  const cv = document.createElement('canvas'); cv.width = t.image.width; cv.height = t.image.height;
  const cx = cv.getContext('2d'); cx.drawImage(t.image, 0, 0); const id = cx.getImageData(0, 0, cv.width, cv.height);
  for (let i = 0; i < id.data.length; i += 4) { const v = id.data[i + 3]; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  cx.putImageData(id, 0, 0); const mask = new THREE.CanvasTexture(cv); lado.alphaMap = mask;
  for (let k = 0; k < camadas; k++) { const m = new THREE.Mesh(geo, lado); m.position.z = -esp * k / camadas; m.castShadow = true; g.add(m); }
  const topo = new THREE.MeshPhysicalMaterial({map: t, alphaTest: .5, transparent: false, roughness: .32, clearcoat: 1, clearcoatRoughness: .12});
  const mt = new THREE.Mesh(geo, topo); mt.position.z = 0.002; mt.castShadow = true; g.add(mt);
  return g;
}
function rotulo(img, larg = 2048, alt = 1024, fundo = '#121014', esc = .82, pos = .25, giro = 0) {
  const cv = document.createElement('canvas'); cv.width = larg; cv.height = alt; const c = cv.getContext('2d');
  c.fillStyle = fundo; c.fillRect(0, 0, larg, alt);
  const h = alt * esc, w = h * img.width / img.height * (larg === alt ? +(q.get('sx') || 1) : 1);
  c.save(); c.translate(larg * pos, alt / 2); c.rotate(giro); c.drawImage(img, -w / 2, -h / 2, w, h); c.restore();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const COR = q.get('cor') ? new THREE.Color(q.get('cor')) : null;
const preto = (r = .38) => COR ? new THREE.MeshPhysicalMaterial({color: COR, roughness: .3, clearcoat: 1, clearcoatRoughness: .1}) : new THREE.MeshPhysicalMaterial({color: 0x121014, roughness: r, clearcoat: .6, clearcoatRoughness: .25});
let obj;
if (modo === 'slab') { obj = await slab(q.get('img'), +(q.get('alt') || 4.2), +(q.get('esp') || .32)); obj.rotation.set(+(q.get('rx') || 0), +(q.get('ry') || 0), +(q.get('rz') || 0)); }
if (modo === 'chaveiro') {
  obj = new THREE.Group(); const sl = await slab(q.get('img'), 3, .22); obj.add(sl);
  const acr = new THREE.Mesh(new THREE.BoxGeometry(3.3 * +(q.get('asp') || 1), 3.3, .08), new THREE.MeshPhysicalMaterial({color: 0xffffff, transmission: 1, roughness: .05, thickness: .3, ior: 1.5, clearcoat: 1, transparent: true, opacity: .35}));
  acr.position.z = .07; obj.add(acr);
  const met = new THREE.MeshPhysicalMaterial({color: 0xdad6de, metalness: 1, roughness: .18});
  const arg = new THREE.Mesh(new THREE.TorusGeometry(.55, .07, 24, 64), met); arg.position.set(0, 2.25, 0); obj.add(arg);
  const elo = new THREE.Mesh(new THREE.TorusGeometry(.18, .045, 16, 48), met); elo.position.set(0, 1.72, 0); elo.rotation.y = Math.PI / 2; obj.add(elo);
  obj.rotation.set(-.1, +(q.get('ry') || .45), +(q.get('rz') || .08)); obj.traverse(o => o.castShadow = true);
}
if (modo === 'caneca') {
  const t = await load(q.get('img')); obj = new THREE.Group();
  const corpo = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.18, 2.9, 128, 1, true),
    new THREE.MeshPhysicalMaterial({map: rotulo(t.image, 2048, 1024, q.get('cor') || '#141216', .8, .25), roughness: .3, clearcoat: 1, clearcoatRoughness: .1, side: THREE.DoubleSide}));
  corpo.rotation.y = Math.PI * .5 + (+(q.get('gira') || 0)); obj.add(corpo);
  const fundo = new THREE.Mesh(new THREE.CircleGeometry(1.18, 64), preto()); fundo.rotation.x = Math.PI / 2; fundo.position.y = -1.45; obj.add(fundo);
  const dentro = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.1, 2.8, 96, 1, true), new THREE.MeshStandardMaterial({color: 0x996bb3, roughness: .4, side: THREE.BackSide}));
  dentro.position.y = .05; obj.add(dentro);
  const borda = new THREE.Mesh(new THREE.TorusGeometry(1.2, .055, 24, 128), preto()); borda.rotation.x = Math.PI / 2; borda.position.y = 1.45; obj.add(borda);
  const alca = new THREE.Mesh(new THREE.TorusGeometry(.62, .14, 32, 64, Math.PI * 1.15), preto()); alca.position.set(1.32, 0, 0); alca.rotation.z = -Math.PI * .575; obj.add(alca);
  obj.traverse(o => o.castShadow = true);
}
if (modo === 'garrafa') {
  const t = await load(q.get('img')); obj = new THREE.Group();
  const pts = []; for (const [rr, y] of [[0, -2.6], [.95, -2.6], [1, -2.45], [1, 1.6], [.95, 1.9], [.62, 2.25], [.6, 2.6]]) pts.push(new THREE.Vector2(rr, y));
  const corpo = new THREE.Mesh(new THREE.LatheGeometry(pts, 128), new THREE.MeshPhysicalMaterial({map: rotulo(t.image, 2048, 2048, '#141216', +(q.get('esc') || .3), +(q.get('pos') || .25), +(q.get('tg') || 0)),
    roughness: .35, metalness: .25, clearcoat: 1, clearcoatRoughness: .15}));
  corpo.rotation.y = -Math.PI / 2; obj.add(corpo);
  const tampa = new THREE.Mesh(new THREE.CylinderGeometry(.66, .66, .7, 64), new THREE.MeshPhysicalMaterial({color: 0x996bb3, roughness: .35, metalness: .3, clearcoat: 1}));
  tampa.position.y = 2.95; obj.add(tampa); obj.traverse(o => o.castShadow = true);
}
if (modo === 'botton') {
  const t = await load(q.get('img')); obj = new THREE.Group();
  const face = new THREE.MeshPhysicalMaterial({map: rotulo(t.image, 1024, 1024, q.get('fundo') || '#996BB3', .62, .5, +(q.get('tg') || 0)), roughness: .2, clearcoat: 1, clearcoatRoughness: .05});
  const lado = new THREE.MeshPhysicalMaterial({color: 0xd8d4dc, metalness: 1, roughness: .22});
  const m = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, .28, 128), [lado, face, lado]); m.rotation.x = Math.PI / 2; obj.add(m);
  obj.rotation.set(+(q.get('rx') || -.25), +(q.get('ry') || .35), 0); obj.traverse(o => o.castShadow = true);
}
cena.add(obj);
// chão escuro reflexivo só de sombra
const chao = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({opacity: .55}));
chao.rotation.x = -Math.PI / 2; chao.position.y = +(q.get('chao') || -2.6); chao.receiveShadow = true; if (q.get('semchao') == null) cena.add(chao);
r.render(cena, cam); window.DONE = true;
</script></body></html>
