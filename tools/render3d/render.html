<!doctype html><html><head><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
const q=new URLSearchParams(location.search);
const W=+q.get('w')||1600,H=+q.get('h')||1600;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.setPixelRatio(1);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=+q.get('exp')||1.0;
r.outputColorSpace=THREE.SRGBColorSpace;r.shadowMap.enabled=true;document.body.appendChild(r.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(+q.get('fov')||30,W/H,0.01,100);
const hdr=await new RGBELoader().loadAsync('studio.hdr');hdr.mapping=THREE.EquirectangularReflectionMapping;

// estúdio escuro com softboxes azuis (reflexos de recorte no metal)
const pm=new THREE.PMREMGenerator(r);const es=new THREE.Scene();es.background=new THREE.Color(0x000000);
const panel=(w,h,col,int,x,y,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(int),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);es.add(m);};
panel(3,8,0x3d6ef5,+q.get('pb')||6,6,1,-4);   // azul atrás direita
panel(3,8,0x87a9ff,+q.get('pb')||6,-6,0,-4);  // azul claro atrás esquerda
panel(6,2,0xffffff,+q.get('pw')||2.5,0,7,2);  // softbox branco em cima
panel(2,6,0x2f5bea,(+q.get('pb')||6)*0.5,7,0,4); // azul lateral frontal
if(q.get('hdr')) {scene.environment=hdr;} else {scene.environment=pm.fromScene(es,0.02).texture;}
scene.environmentIntensity=+q.get('env')||1;
if(q.get('tint')) setTimeout(()=>{},0);
// luz principal branca suave de cima
const key=new THREE.DirectionalLight(0xffffff,+q.get('key')||1.6);key.position.set(-1.5,3,2.5);scene.add(key);
// rim lights azuis atrás
const blue=0x3d6ef5, ice=0x87a9ff;
const r1=new THREE.DirectionalLight(blue,+q.get('rim')||6);r1.position.set(3,1.5,-3);scene.add(r1);
const r2=new THREE.DirectionalLight(ice,(+q.get('rim')||6)*0.8);r2.position.set(-3,0.5,-2.5);scene.add(r2);
const fill=new THREE.DirectionalLight(blue,1.2);fill.position.set(2,-1,3);scene.add(fill);
const g=await new GLTFLoader().loadAsync(q.get('m'));
const obj=g.scene;scene.add(obj);
const tint=q.get('tint');if(tint)obj.traverse(o=>{if(o.isMesh&&o.material&&o.material.metalness>0.5){o.material.color=new THREE.Color(tint);}});
const rot=(q.get('rot')||'0,0,0').split(',').map(v=>THREE.MathUtils.degToRad(+v));obj.rotation.set(...rot);
const box=new THREE.Box3().setFromObject(obj);const c=box.getCenter(new THREE.Vector3());const s=box.getSize(new THREE.Vector3());
obj.position.sub(c);
const d=Math.max(s.x,s.y,s.z)/(2*Math.tan(THREE.MathUtils.degToRad(cam.fov/2)))*(+q.get('zoom')||1.25);
const el=THREE.MathUtils.degToRad(+q.get('el')||0), az=THREE.MathUtils.degToRad(+q.get('az')||0);
cam.position.set(d*Math.sin(az)*Math.cos(el),d*Math.sin(el),d*Math.cos(az)*Math.cos(el));cam.lookAt(0,0,0);
r.render(scene,cam);window.DONE=true;
</script></body></html>
