<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c" width="270" height="480"></canvas>
<script>
const A='../../game/assets/',c=document.getElementById('c'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const im=n=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=A+n});
let I={};
window.ready=(async()=>{for(const n of['logo-collab','vela-1','vela-2','bg1','bg2','bg3','p1','p2','p3','p4','p5','p6','p7','p8'])I[n]=await im((n[0]=='p'&&n.length==2?'pecas/':'')+n+'.png');await document.fonts.load('40px "Pirata One"');await document.fonts.load('10px Silkscreen');await document.fonts.load('bold 10px Silkscreen');return 1})();
function txt(s,y,f,col,sh='#000'){x.font=f;x.textAlign='center';x.textBaseline='middle';const X=135;x.fillStyle=sh;x.fillText(s,X+1,y+1);x.fillText(s,X+2,y+2);x.fillStyle=col;x.fillText(s,X,y)}
function velas(t,ys){const xs=[22,48,222,248];xs.forEach((vx,i)=>{const fr=((t*8+i*1.7)|0)%2;x.drawImage(fr?I['vela-1']:I['vela-2'],vx-5,ys+(i%2)*14);
 const g=x.createRadialGradient(vx,ys+(i%2)*14+2,0,vx,ys+(i%2)*14+2,18+Math.sin(t*13+i)*3);g.addColorStop(0,'rgba(255,170,60,.35)');g.addColorStop(1,'rgba(255,120,30,0)');x.fillStyle=g;x.fillRect(vx-25,ys-25+(i%2)*14,50,50)})}
function fundo(t,bg,a){x.fillStyle='#0b0b0f';x.fillRect(0,0,270,480);x.globalAlpha=a;x.drawImage(I[bg],0,0);x.globalAlpha=1;x.fillStyle='rgba(11,11,15,.55)';x.fillRect(0,0,270,480)}
const st=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
window.intro=t=>{x.clearRect(0,0,270,480);
 if(t<3){fundo(t,'bg1',st(t,1.2,2.2)*.8);
  if(t<1.1){x.fillStyle='#000';x.fillRect(0,0,270,480);if(((t*4)|0)%2)txt('PRESS START',240,'bold 14px Silkscreen','#ffc23d');txt('© HARD × BLOCK 2026',300,'8px Silkscreen','#7b7b86');return}
  const k=st(t,1.1,1.6),bump=((t-1.1)*30|0)%2&&t<1.4?2:0;x.globalAlpha=k;x.drawImage(I['logo-collab'],15,130-bump-(1-k)*20);x.globalAlpha=1;
  velas(t,250);if(t>1.6)txt('HARD × BLOCK',290,'44px "Pirata One"','#f4f2ea');if(t>1.6){x.font='44px "Pirata One"';}
  if(t>2)txt('O ARCADE DO DROP',330,'bold 10px Silkscreen','#f0662a');return}
 fundo(t,'bg2',.8);const u=t-3;
 txt('O DROP',120-Math.max(0,1-u*4)*60,'50px "Pirata One"','#f4f2ea');if(u>.3)txt('VIROU JOGO',165,'50px "Pirata One"','#f0662a');
 for(let i=0;i<8;i++){const s=I['p'+(i+1)],row=i<4?0:1,col=i%4,cx=45+col*60,cy=255+row*75,ap=st(u,.5+i*.12,.7+i*.12);if(!ap)continue;
  const sc=Math.cos(u*4+i*.8);x.save();x.translate(cx,cy+Math.sin(u*5+i)*3);x.scale(Math.round(sc*8)/8||.125,1);x.drawImage(s,-17,-20);x.restore()}
 txt('8 PEÇAS · 2 FASES · 1 CAVEIRA',420,'bold 8px Silkscreen','#ffc23d');velas(t,445)};
window.cta=t=>{x.clearRect(0,0,270,480);fundo(t,'bg3',.9);const k=st(t,0,.4);x.globalAlpha=k;x.drawImage(I['logo-collab'],15,70);x.globalAlpha=1;
 if(t>.3)txt('JOGUE',205,'60px "Pirata One"','#f4f2ea');if(t>.5)txt('AGORA',260,'60px "Pirata One"','#f0662a');
 if(t>.9){x.fillStyle='#2f8f3a';x.fillRect(25,300,220,28);x.strokeStyle='#6fd16a';x.lineWidth=2;x.strokeRect(25,300,220,28);txt('hard-x-block.vercel.app',314,'bold 10px Silkscreen','#f4f2ea','#173f1c')}
 if(t>1.3)txt('@block.office × @hardjeanssanto',350,'bold 8px Silkscreen','#a77be0');
 if(t>1.6&&((t*3)|0)%2)txt('▶ TOQUE PRA JOGAR ◀',385,'bold 9px Silkscreen','#ffc23d');velas(t,425)};
window.cap=(s,y,col)=>{x.clearRect(0,0,270,480);x.font='30px "Pirata One"';const w=x.measureText(s).width+20;x.fillStyle='rgba(11,11,15,.85)';x.fillRect(135-w/2,y-20,w,40);x.fillStyle=col;x.fillRect(135-w/2,y+18,w,2);txt(s,y,'30px "Pirata One"','#f4f2ea')};
window.cap2=(a,b)=>{x.clearRect(0,0,270,480);x.fillStyle='rgba(11,11,15,.9)';x.fillRect(10,410,250,52);x.fillStyle='#6fd16a';x.fillRect(10,460,250,2);txt(a,428,'26px "Pirata One"','#f4f2ea');txt(b,450,'bold 10px Silkscreen','#6fd16a')};
</script>
