<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#F7F9FC}
.blob{position:absolute;border:70px solid var(--azul);border-radius:120px;filter:blur(14px);opacity:.9}
.ghost{position:absolute;border:70px solid #E4EAF2;border-radius:120px}
.photoBg{position:absolute;left:470px;top:150px;width:520px;height:990px;border-radius:70px;background:linear-gradient(160deg,#5AA2FF,#2D7FF0)}
.doc{position:absolute;left:420px;top:60px;width:640px;height:1080px;object-fit:cover;object-position:top;clip-path:inset(0 70px 0 50px round 0 0 70px 70px)}
.card{position:absolute;left:110px;top:330px;width:520px;padding:70px 56px 56px;border-radius:64px;background:var(--azul);color:#fff;box-shadow:0 30px 60px rgba(45,127,240,.35)}
.ico{position:absolute;left:190px;top:240px;width:150px;height:150px;border-radius:40px;background:var(--navy);display:grid;place-items:center;z-index:3}
h1{font-size:76px;line-height:1.02;letter-spacing:-.03em;font-weight:300}
h1 b{font-weight:700}
.sub{font-size:31px;line-height:1.3;margin:26px 0 40px;font-weight:400;opacity:.95}
.side{position:absolute;left:150px;top:1030px;font-size:31px;line-height:1.35;color:var(--navy);width:300px}
.side b{font-weight:600;color:var(--azul)}
.foot{position:absolute;left:110px;right:110px;bottom:80px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:var(--cinza)}
.foot .lg{font-size:44px;letter-spacing:-.03em;color:var(--navy)}
</style></head><body>
