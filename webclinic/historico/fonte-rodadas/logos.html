<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:var(--gelo);padding:70px 60px}
h1{font-size:30px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--cinza);margin-bottom:34px}
h1 b{color:var(--azul)}
.grid{display:grid;grid-template-columns:466px 466px;gap:28px}
.card{background:#fff;border-radius:36px;height:560px;padding:34px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(11,31,58,.06)}
.tag{font-size:20px;font-weight:600;color:var(--azul);letter-spacing:.15em}
.tag span{color:var(--cinza);font-weight:400;letter-spacing:.05em;margin-left:8px}
.main{flex:1;display:grid;place-items:center}
.row{display:flex;gap:18px;align-items:center}
.av{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(11,31,58,.12)}
.neg{flex:1;height:118px;border-radius:26px;background:var(--azul);display:grid;place-items:center}
/* L1 */
.l1{font-size:78px;letter-spacing:-.03em;line-height:1;position:relative;white-space:nowrap}
.l1 .w{font-weight:300}.l1 .c{font-weight:700;color:var(--azul);position:relative}
.l1 .i{position:relative;display:inline-block}
.l1 .plus{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:26px;height:26px}
/* L2 */
.l2{display:flex;align-items:center;gap:18px;font-size:48px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
/* L3 */
.l3{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.l3 .t{font-size:70px;font-weight:700;letter-spacing:-.04em;line-height:1}
.l3 .t b{color:var(--azul);font-weight:700}
/* L4 */
.l4{display:flex;align-items:center;gap:22px}
.l4 .t{font-size:52px;line-height:.95;letter-spacing:-.02em}
.l4 .t div:first-child{font-weight:300}.l4 .t div:last-child{font-weight:700}
</style></head><body>

<div class="main"><div class="l1"><span class="w">web</span><span class="c">clin<span class="i">ı<svg class="plus" viewBox="0 0 22 22"><path d="M11 2v18M2 11h18" stroke="#2D7FF0" stroke-width="6" stroke-linecap="round"/></svg></span>c</span></div></div>
<div class="row"><div class="av" style="background:#2D7FF0"><div class="l1" style="font-size:50px;color:#fff"><span class="w">w</span><span class="c" style="color:#fff">c</span><svg viewBox="0 0 22 22" style="position:absolute;right:-16px;top:-8px;width:18px;height:18px"><path d="M11 2v18M2 11h18" stroke="#CFE6F7" stroke-width="6" stroke-linecap="round"/></svg></div></div>

<div class="neg"><div class="l4" style="gap:14px"><svg width="70" height="70" viewBox="0 0 124 124"><rect width="124" height="124" rx="34" fill="#fff"/><text x="58" y="86" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="64" fill="#0B1F3A" letter-spacing="-3">wc</text><path d="M101 18v20M91 28h20" stroke="#2D7FF0" stroke-width="7" stroke-linecap="round"/></svg><div class="t" style="font-size:32px;color:#fff"><div>web</div><div>clinic</div></div></div></div></div></div>

</div></body></html>
