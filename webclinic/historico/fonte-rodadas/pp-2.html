<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:radial-gradient(ellipse 75% 50% at 50% 66%,#CFE3FA 0%,#EAF2FC 45%,#F7F9FC 100%)}

.rec{font:500 13px Poppins;letter-spacing:.2em;color:#FA5F6D;display:flex;align-items:center;gap:8px}
.rec:before{content:'';width:9px;height:9px;border-radius:50%;background:#FA5F6D;}
.scr{position:relative;height:414px;padding:28px 34px}
.scr .g{position:absolute;inset:0;background-image:linear-gradient(rgba(90,162,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(90,162,255,.08) 1px,transparent 1px);background-size:36px 36px}
.lab{font:500 13px Poppins;letter-spacing:.22em;color:#6E84AD}
.vit{position:absolute;right:34px;top:28px;text-align:right}
.vit .n{font-size:84px;font-weight:600;letter-spacing:-.04em;line-height:1.05;color:#FA5F6D}
.vit .n small{font-size:44px;font-weight:500}
.vit2{position:absolute;right:34px;top:236px;text-align:right}
.vit2 .n{font-size:54px;font-weight:600;letter-spacing:-.03em;line-height:1.1;color:#FF8D96}
.ecg{position:absolute;left:0;top:96px}
.load{position:absolute;left:34px;bottom:34px;width:380px}
.load .tr{height:10px;border-radius:5px;background:#132646;margin-top:12px;overflow:hidden}
.load .tr div{width:28%;height:100%;background:linear-gradient(90deg,#2D7FF0,#5AA2FF);}
.chip{position:absolute;z-index:6;display:flex;align-items:center;gap:14px;border-radius:24px;padding:16px 22px;font:600 21px Poppins;border:2px solid #E2EAF4;box-shadow:0 24px 44px -10px rgba(45,127,240,.25)}
.c1{left:90px;top:505px;background:#fff;color:var(--navy);transform:rotate(-4deg)}
.c1 .ic{width:46px;height:46px;border-radius:14px;background:#FFE7EA;display:grid;place-items:center}
.c1 small{display:block;font:400 15px Poppins;color:var(--cinza)}
.cta{position:absolute;right:100px;top:985px;z-index:6}
.phrase{position:absolute;bottom:120px;left:110px;right:110px;text-align:center;font:400 29px/1.4 Poppins;color:var(--navy);z-index:6}
.phrase b{font-weight:700;color:var(--azul)}
.src{position:absolute;bottom:66px;width:100%;text-align:center;font:500 15px Poppins;letter-spacing:.24em;color:#8A97AA}
</style></head><body>
