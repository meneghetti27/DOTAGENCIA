<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:var(--gelo);padding:48px 60px}
h1{font-size:28px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--cinza);margin-bottom:24px}
h1 b{color:var(--azul)}
.grid{display:grid;grid-template-columns:466px 466px;gap:18px}
.card{background:#fff;border-radius:34px;height:282px;padding:28px 30px;display:flex;flex-direction:column;position:relative}
.tag{font-size:19px;font-weight:600;color:var(--azul);letter-spacing:.15em}
.tag span{color:var(--cinza);font-weight:400;letter-spacing:.04em;margin-left:8px}
.main{flex:1;display:grid;place-items:center}
.av{display:none !important;position:absolute;right:26px;bottom:22px;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;border:2px solid #E2EAF4}
.wm{font-size:58px;font-weight:700;letter-spacing:-.045em;line-height:1;color:var(--navy)}
.wm b{color:var(--azul);font-weight:700}
.wm .l{font-weight:300}
</style></head><body>
