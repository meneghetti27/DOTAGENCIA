<!doctype html><html><head><style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const q=new URLSearchParams(location.search);
const W=+q.get('w')||1200,H=+q.get('h')||1200;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.setPixelRatio(1);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=+(q.get('exp')||.95);r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const s=new THREE.Scene();const pm=new THREE.PMREMGenerator(r);s.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
s.environmentIntensity=+(q.get('env')||.45);
const cam=new THREE.PerspectiveCamera(30,W/H,.1,100);cam.position.set(0,0,+(q.get('z')||9));
const k=new THREE.DirectionalLight(0xffffff,2.2);k.position.set(3,5,6);s.add(k);
const fill=new THREE.DirectionalLight(0xbfdcff,1.2);fill.position.set(-5,-2,3);s.add(fill);
const blue=new THREE.MeshPhysicalMaterial({color:0x2D7FF0,roughness:.18,clearcoat:1,clearcoatRoughness:.08,metalness:0});
const light=new THREE.MeshPhysicalMaterial({color:0x5AA2FF,roughness:.2,clearcoat:1,clearcoatRoughness:.1});
const white=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.25,clearcoat:1,clearcoatRoughness:.15});
const navy=new THREE.MeshPhysicalMaterial({color:0x0B1F3A,roughness:.6,clearcoat:.25,clearcoatRoughness:.5});
const glass=new THREE.MeshPhysicalMaterial({color:0xEAF4FF,roughness:.05,transmission:1,thickness:.6,ior:1.4,clearcoat:1});
const g=new THREE.Group();s.add(g);
const obj=q.get('obj')||'plus';
function ext(shape,depth,bev,mat){const geo=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:12,curveSegments:24});geo.center();return new THREE.Mesh(geo,mat);}
if(obj==='plus'){
  const a=new RoundedBoxGeometry(.9,2.6,.9,8,.3), b=new RoundedBoxGeometry(2.6,.9,.9,8,.3);
  const m=q.get('mat')==='white'?white:blue; g.add(new THREE.Mesh(a,m),new THREE.Mesh(b,m));
}
if(obj==='cursor'){
  const p=[[0,0],[0,34],[9,26],[15,40],[21,37],[15,24],[27,24]];const sh=new THREE.Shape();
  p.forEach(([x,y],i)=>i?sh.lineTo(x/14,-y/14):sh.moveTo(x/14,-y/14));sh.closePath();
  g.add(ext(sh,.35,.12,q.get('mat')==='white'?white:blue));
}
if(obj==='window'){
  const body=new THREE.Mesh(new RoundedBoxGeometry(4.6,3.1,.28,8,.14),white);g.add(body);
  const bar=new THREE.Mesh(new RoundedBoxGeometry(4.3,.34,.06,4,.03),new THREE.MeshPhysicalMaterial({color:0xEEF5FC,roughness:.4}));bar.position.set(0,1.18,.15);g.add(bar);
  [[-1.95,0xFA5F6D],[-1.75,0xC9D6E6],[-1.55,0xC9D6E6]].forEach(([x,c])=>{const d=new THREE.Mesh(new THREE.SphereGeometry(.06,24,24),new THREE.MeshPhysicalMaterial({color:c,roughness:.3}));d.position.set(x,1.18,.2);g.add(d)});
  const scr=new THREE.Mesh(new RoundedBoxGeometry(4.2,2.3,.05,4,.04),navy);scr.position.set(0,-.18,.15);g.add(scr);
  const pts=[[-1.8,-.3],[-.5,-.3],[-.3,.35],[0,-.95],[.25,.15],[.4,-.3],[1.8,-.3]].map(([x,y])=>new THREE.Vector3(x,y-.05,.22));
  const path=new THREE.CurvePath();for(let i=0;i<pts.length-1;i++)path.add(new THREE.LineCurve3(pts[i],pts[i+1]));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(path,200,.055,16,false),new THREE.MeshPhysicalMaterial({color:0x5AA2FF,emissive:0x2D7FF0,emissiveIntensity:.9,roughness:.2})));
  const btn=new THREE.Mesh(new RoundedBoxGeometry(1.3,.38,.14,6,.18),blue);btn.position.set(1.15,-.95,.26);g.add(btn);
}
if(obj==='heart'){
  const sh=new THREE.Shape();sh.moveTo(0,-1.2);sh.bezierCurveTo(-1.6,-.1,-1.4,1.1,-.7,1.1);sh.bezierCurveTo(-.25,1.1,0,.75,0,.5);sh.bezierCurveTo(0,.75,.25,1.1,.7,1.1);sh.bezierCurveTo(1.4,1.1,1.6,-.1,0,-1.2);
  g.add(ext(sh,.5,.3,blue));
}

if(obj==='clock'){
  const body=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,.7,64),blue);body.rotation.x=Math.PI/2;g.add(body);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(1.3,.12,24,64),white);rim.position.z=.36;g.add(rim);
  const face=new THREE.Mesh(new THREE.CircleGeometry(1.18,64),white);face.position.z=.36;g.add(face);
  for(let i=0;i<12;i++){const t=new THREE.Mesh(new RoundedBoxGeometry(.06,i%3?.12:.22,.03,2,.01),navy);const a=i/12*Math.PI*2;t.position.set(Math.sin(a)*.98,Math.cos(a)*.98,.38);t.rotation.z=-a;g.add(t);}
  const h1=new THREE.Mesh(new RoundedBoxGeometry(.1,.62,.04,2,.02),navy);h1.position.set(-.24,.2,.4);h1.rotation.z=.85;g.add(h1);
  const h2=new THREE.Mesh(new RoundedBoxGeometry(.08,.9,.04,2,.02),navy);h2.position.set(.05,.43,.42);h2.rotation.z=-.1;g.add(h2);
  const c=new THREE.Mesh(new THREE.SphereGeometry(.09,24,24),blue);c.position.z=.44;g.add(c);
  [-1,1].forEach(sx=>{const b=new THREE.Mesh(new THREE.SphereGeometry(.42,48,24,0,Math.PI*2,0,Math.PI/2),blue);b.position.set(sx*.85,1.2,0);b.rotation.z=-sx*.6;g.add(b);
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.5,16),white);leg.position.set(sx*.75,-1.35,0);leg.rotation.z=sx*.5;g.add(leg);});
  const hm=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.5,16),white);hm.position.set(0,1.55,0);g.add(hm);
}
if(obj==='mag'){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.17,32,96),blue);g.add(ring);
  const lens=new THREE.Mesh(new THREE.CylinderGeometry(.95,.95,.08,64),glass);lens.rotation.x=Math.PI/2;g.add(lens);
  const hd=new THREE.Mesh(new RoundedBoxGeometry(.34,1.6,.34,6,.16),navy);hd.position.set(1.15,-1.15,0);hd.rotation.z=Math.PI/4;g.add(hd);
  const nk=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.4,24),white);nk.position.set(.78,-.78,0);nk.rotation.z=Math.PI/4;g.add(nk);
}
if(obj==='cal'){
  const base=new THREE.Mesh(new RoundedBoxGeometry(2.6,2.6,.5,8,.2),white);g.add(base);
  const top=new THREE.Mesh(new RoundedBoxGeometry(2.6,.75,.54,8,.2),blue);top.position.set(0,.95,.02);g.add(top);
  [-.7,.7].forEach(x=>{const r=new THREE.Mesh(new RoundedBoxGeometry(.18,.6,.18,4,.08),navy);r.position.set(x,1.35,.1);g.add(r);});
  for(let i=0;i<3;i++)for(let j=0;j<4;j++){const on=(i===1&&j===2);const d=new THREE.Mesh(new RoundedBoxGeometry(.42,.34,on?.18:.06,4,.06),on?blue:new THREE.MeshPhysicalMaterial({color:0xDCEBFB,roughness:.4}));d.position.set(-.78+j*.52,.12-i*.5,.28);g.add(d);}
}
if(obj==='handset'){
  const sh=new THREE.Shape();sh.moveTo(-1.6,.2);sh.quadraticCurveTo(0,.75,1.6,.2);sh.lineTo(1.6,-.25);sh.quadraticCurveTo(0,.25,-1.6,-.25);sh.closePath();
  const bar=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.45,bevelEnabled:true,bevelThickness:.15,bevelSize:.15,bevelSegments:10,curveSegments:32}),blue);bar.geometry.center();g.add(bar);
  [-1.55,1.55].forEach(x=>{const e=new THREE.Mesh(new THREE.CylinderGeometry(.55,.45,.6,48),blue);e.position.set(x,-.45,0);g.add(e);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.62,48),white);cap.position.set(x,-.46,0);g.add(cap);});
}

g.rotation.set(+(q.get('rx')||0)*Math.PI/180,+(q.get('ry')||0)*Math.PI/180,+(q.get('rz')||0)*Math.PI/180);
g.scale.setScalar(+(q.get('s')||1));
r.render(s,cam);window.DONE=1;
</script></body></html>
